<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fitlytics – Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/skeleton.css" />
</head>

<body>

  <div class="app-wrapper">
    <!-- SKELETON — shown instantly, hidden by auth.js after 600ms -->
    <div id="auth-skeleton" class="skeleton-auth-screen">
      <div class="skeleton skeleton-auth-logo"></div>
      <div class="skeleton skeleton-auth-brand"></div>
      <div class="skeleton skeleton-auth-brand-sub"></div>

      <div class="skeleton-auth-card">
        <div class="skeleton skeleton-auth-title"></div>
        <div class="skeleton skeleton-auth-subtitle"></div>
        <div class="skeleton skeleton-input"></div>
        <div class="skeleton skeleton-input"></div>
        <div class="skeleton skeleton-auth-btn"></div>
      </div>
    </div>

    <!-- REAL CONTENT — hidden on load -->
    <div id="auth-real" style="display: none; width: 100%;">
      <div class="auth-screen">

        <!-- Logo / Brand -->
        <div class="auth-brand">
          <div class="auth-logo">
            <i class="fa-solid fa-dumbbell"></i>
          </div>
          <h1 class="auth-brand-name">Fitlytics</h1>
          <p class="auth-brand-sub">Your fitness journey starts here</p>
        </div>

        <!-- Sign In Form -->
        <div class="auth-card">
          <h2 class="auth-title">Welcome Back 👋</h2>
          <p class="auth-subtitle">Sign in to your account</p>

          <!-- Error message box (shown by JS if login fails) -->
          <div class="auth-error" id="signin-error" style="display: none;">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="signin-error-text">Invalid email or password.</span>
          </div>

          <div class="auth-form">

            <!-- Email -->
            <div class="form-group">
              <label class="form-label">Email Address</label>
              <div class="form-input-wrap">
                <i class="fa-regular fa-envelope form-icon"></i>
                <input type="email" id="signin-email" class="form-input" placeholder="varsha@example.com"
                  autocomplete="email" />
              </div>
            </div>

            <!-- Password -->
            <div class="form-group">
              <label class="form-label">Password</label>
              <div class="form-input-wrap">
                <i class="fa-solid fa-lock form-icon"></i>
                <input type="password" id="signin-password" class="form-input" placeholder="Enter your password"
                  autocomplete="current-password" />
                <!-- Toggle show/hide password -->
                <button class="form-eye-btn" id="toggle-signin-password" type="button">
                  <i class="fa-regular fa-eye" id="eye-icon-signin"></i>
                </button>
              </div>
            </div>

            <!-- Remember Me -->
            <div class="form-row-between">
              <label class="form-checkbox-label">
                <input type="checkbox" id="remember-me" />
                <span>Remember me</span>
              </label>
              <a href="#" class="form-link">Forgot password?</a>
            </div>

            <!-- Sign In Button -->
            <button class="auth-btn" id="signin-btn">
              Sign In
            </button>

          </div>
        </div>

        <!-- Link to Sign Up -->
        <p class="auth-switch-text">
          Don't have an account?
          <a href="sign-up.html" class="auth-switch-link">Create one</a>
        </p>

      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>

</body>

</html>
