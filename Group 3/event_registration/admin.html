<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container admin-container">

    <h1>Welcome Admin</h1>

    <h2>Dashboard Summary</h2>

    <div class="summary-box">
      <div class="summary-card">
        <p class="summary-number" id="totalEventsCount">9</p>
        <p>Total Events</p>
      </div>
      <div class="summary-card">
        <p class="summary-number" id="totalRegistrationsCount">0</p>
        <p>Total Registrations</p>
      </div>
      <div class="summary-card">
        <p class="summary-number" id="totalSeatsCount">0</p>
        <p>Total Available Seats</p>
      </div>
    </div>

    <h2>Events List</h2>

    <div class="table-wrapper">
      <table class="event-table">
        <thead>
          <tr>
            <th>Event Name</th>
            <th>Category</th>
            <th>Date</th>
            <th>Venue</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="eventTableBody">
        </tbody>
      </table>
    </div>

    <h2>Add Event</h2>

    <div class="admin-form">

      <label for="eventName">Event Name</label>
      <input type="text" id="eventName" placeholder="Enter event name">

      <label for="eventCategory">Category</label>
      <input type="text" id="eventCategory" placeholder="e.g. Technology, Workshop">

      <label for="eventDescription">Description</label>
      <textarea id="eventDescription" rows="3" placeholder="Short event description"></textarea>

      <label for="eventVenue">Venue</label>
      <input type="text" id="eventVenue" placeholder="Enter venue">

      <label for="eventDate">Date</label>
      <input type="date" id="eventDate">

      <label for="eventTime">Time</label>
      <input type="time" id="eventTime">

      <label for="eventSeats">Maximum Seats</label>
      <input type="number" id="eventSeats" placeholder="Enter maximum seats">

      <label for="eventBanner">Banner URL</label>
      <input type="text" id="eventBanner" placeholder="Enter image URL">

      <div class="form-buttons">
        <button id="saveEventBtn">Save Event</button>
        <button id="resetEventBtn" class="reset-btn">Reset</button>
      </div>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
